[package]
name = "spike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Phase 0 research spike. Throwaway code answering the 5 load-bearing questions in plan.md."

[[bin]]
name = "spike"
path = "src/main.rs"

[dependencies]
# Pull `testing` for TelemetryContext::test() — useful but not strictly required;
# the noop harness is used in q1-q4 which run without init().
foundations = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
