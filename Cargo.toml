[workspace]
resolver = "2"
members = [
    "culpert",
    "culpert-foundations",
    "culpert-tracing",
    "culpert-macros",
    "culpert-cli",
    "examples/mock-axum",
    "examples/foundations",
    "examples/tracing",
    "examples/macros",
    "examples/macros-async",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rupert648/culpert"
readme = "README.md"
keywords = ["profiling", "allocation", "heap", "pprof", "tracing"]
categories = ["development-tools::profiling", "memory-management"]

[workspace.dependencies]
# Internal crates
culpert = { path = "culpert", version = "0.2.1" }
culpert-foundations = { path = "culpert-foundations", version = "0.2.1" }
culpert-tracing = { path = "culpert-tracing", version = "0.2.1" }
culpert-macros = { path = "culpert-macros", version = "0.2.1" }

backtrace = "0.3"
fastrand = "2.4.1"
libc = "0.2"
parking_lot = "0.12"
smallvec = "1"
flate2 = "1"
prost = "0.14"
foundations = { version = "5", default-features = false, features = ["tracing", "telemetry-server"] }
tikv-jemallocator = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
criterion = { version = "0.7", features = ["html_reports"] }
tracing = "0.1"
tracing-subscriber = "0.3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
