name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint the workflows themselves. Cheap and fast; catches syntax /
  # expression errors before any real build runs.
  actionlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: actionlint (workflows)
      # actionlint is workflow-focused; doesn't natively understand
      # `action.yml` schema (treats it as a malformed workflow).
      # See the bash check below for action.yml-specific gotchas.
      uses: docker://rhysd/actionlint:1.7.7
      with:
        args: -color
    - name: composite actions can't reference secrets / vars
      # GitHub evaluates `${{ ... }}` template expressions in every YAML
      # string value in an action.yml, including the documentation
      # `description:` fields. Composite actions never see `secrets.*`
      # or `vars.*` (caller must forward these as inputs), so any
      # reference to them is a "Unrecognized named-value" error at
      # load time — usually because someone copied a usage example
      # from the README into a description.
      #
      # `github.*`, `inputs.*`, `steps.*`, `env.*` and `runner.*` are
      # all legitimately usable inside `runs:` step bodies and aren't
      # flagged here.
      run: |
        # `^[^#]*` skips YAML comment lines (which GH doesn't evaluate
        # — see the leading documentation block at the top of action.yml
        # which legitimately shows expression usage in caller-side
        # workflows).
        bad=$(grep -nE '^[^#]*\$\{\{ *(secrets|vars)\.' .github/actions/*/action.yml || true)
        if [ -n "$bad" ]; then
          echo "::error::action.yml fields can't reference secrets.* or vars.* — write them as prose."
          echo "$bad"
          exit 1
        fi

  # Build, lint, fmt, test. The "is the code OK" job.
  build:
    needs: actionlint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: cargo fmt --check
      # Fails the build if `cargo fmt --all` would produce a diff. Cheaper
      # to enforce here than during review.
      run: cargo fmt --all --check
    - name: Build
      run: cargo build --workspace --verbose
    - name: Clippy
      # -D warnings promotes any clippy warning to an error so PRs can't
      # land new lints. --all-targets covers tests, benches, examples.
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --workspace --verbose

  # Capture an allocation profile from example-macros and diff it
  # against the latest baseline on main. Demonstrates how external
  # users wire up the `culpert-diff` composite action from this repo
  # against their own service.
  #
  # `pull_request` permissions: write needed so the sticky-comment
  # step can edit/post on the PR. `contents: read` is the implicit
  # default; we make it explicit for clarity.
  #
  # Requirements:
  #   * Repo VAR    `CULPERT_ARCHIVE` = the deployed worker URL,
  #     e.g. https://culpert-archive.<your-subdomain>.workers.dev
  #   * Repo SECRET `CULPERT_TOKEN`   = the AUTH_TOKEN you set via
  #     `wrangler secret put AUTH_TOKEN` on the archive.
  profile:
    runs-on: ubuntu-latest
    needs: build  # don't bother profiling a broken build
    permissions:
      contents: read
      pull-requests: write  # sticky-pull-request-comment writes here

    steps:
    - uses: actions/checkout@v4

    - name: Install culpert CLI from crates.io
      # Now that culpert-cli is published, external users would do this
      # too. `cargo install --locked` uses the Cargo.lock from the
      # crate's source dir so the build is reproducible.
      run: cargo install --locked culpert-cli

    - name: Build example-macros
      # Workload-specific; not on crates.io. Release for realistic
      # allocation patterns.
      run: cargo build --release -p example-macros

    - name: Capture profile
      # example-macros runs 2000 iterations of `handle_request` in
      # under a second and writes /tmp/example-macros.pb.gz.
      run: ./target/release/example-macros

    # The composite action handles everything downstream of the
    # captured profile: pull baseline → diff → step summary → sticky
    # PR comment → upload as the new baseline. Same action external
    # users would invoke against their own service profiles. With
    # culpert installed to ~/.cargo/bin (on $PATH after the install
    # step above), the action's `culpert-cli` default of "culpert"
    # works as-is.
    - name: culpert diff against main
      uses: ./.github/actions/culpert-diff
      with:
        archive-url:   ${{ vars.CULPERT_ARCHIVE }}
        archive-token: ${{ secrets.CULPERT_TOKEN }}
        profile:       /tmp/example-macros.pb.gz
        # TODO: flip to "true" once main has a few weeks of stable
        # baselines and any flagged regressions are real signal.
        fail-on-regression: "false"
