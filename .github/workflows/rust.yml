name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: cargo fmt --check
      # Fails the build if `cargo fmt --all` would produce a diff. Cheaper
      # to enforce here than during review.
      run: cargo fmt --all --check
    - name: Build
      run: cargo build --workspace --verbose
    - name: Clippy
      # -D warnings promotes any clippy warning to an error so PRs can't
      # land new lints. --all-targets covers tests, benches, examples.
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --workspace --verbose
