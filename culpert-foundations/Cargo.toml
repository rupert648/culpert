[package]
name = "culpert-foundations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Compatibility crate for culpert's built-in foundations integration."

[dependencies]
culpert = { workspace = true, features = ["foundations"] }

[dev-dependencies]
# `testing` for TelemetryContext::test() in integration tests.
foundations = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
criterion = { workspace = true }
tikv-jemallocator = { workspace = true }

[[bench]]
name = "foundations_overhead"
harness = false
