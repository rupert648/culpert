[package]
name = "culpert-foundations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "foundations adapter for culpert: maps TelemetryContext spans into culpert's SpanContext and provides a TelemetryServerRoute for serving pprof profiles."

[dependencies]
culpert = { workspace = true }
foundations = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# `testing` for TelemetryContext::test() in integration tests.
foundations = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
criterion = { workspace = true }
tikv-jemallocator = { workspace = true }

[[bench]]
name = "foundations_overhead"
harness = false
