[package]
name = "culpert-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for analyzing culpert profiles (`culpert report`, `culpert diff`)."

[[bin]]
name = "culpert"
path = "src/main.rs"
# Don't generate rustdoc for the binary — it shares its name with the
# `culpert` library and would collide on `target/doc/culpert/index.html`.
# Binary-only CLI; nothing to document for downstream users.
doc = false

[dependencies]
culpert = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
