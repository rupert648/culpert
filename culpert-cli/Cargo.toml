[package]
name = "culpert-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
# culpert-cli is a binary CLI, so override the workspace's library-
# focused categories with command-line-utilities + the shared profiling
# one. Crates.io allows up to 5 categories.
categories = ["command-line-utilities", "development-tools::profiling"]
description = "CLI for analyzing culpert profiles (`culpert report` / `diff` / `info` / `upload` / `pull`)."

[[bin]]
name = "culpert"
path = "src/main.rs"
# Don't generate rustdoc for the binary — it shares its name with the
# `culpert` library and would collide on `target/doc/culpert/index.html`.
# Binary-only CLI; nothing to document for downstream users.
doc = false

[features]
# Off-by-default support for sending Cloudflare Access service-token
# headers (`CF-Access-Client-Id` / `CF-Access-Client-Secret`) when
# calling a `culpert-archive` instance that lives behind Cloudflare
# Access. Builds without this feature don't carry the flags or the
# header-emitting code paths.
#
# Enable via `cargo install --features cloudflare-access culpert-cli`.
# The culpert-diff composite action installs with this feature on
# automatically.
default = []
cloudflare-access = []

[dependencies]
culpert = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
insta = "1"
tempfile = "3"
